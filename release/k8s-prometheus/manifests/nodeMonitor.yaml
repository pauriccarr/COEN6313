apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: checkoutservice
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: ["default"]
  selector:
    matchLabels:
      app: checkoutservice
  # Copies the pod's version label (original / agent) onto every series.
  podTargetLabels:
  - version
  podMetricsEndpoints:
  - port: metrics      # v1 (checkoutservice), :9090
    path: /metrics
    interval: 15s
  - port: http         # agent (checkoutservice-agent), :8080
    path: /metrics
    interval: 15s

