name: Undeploy Monitoring to GKE

on:
  push:
    branches: [main]
    paths:
      - 'release/kube-prometheus/manifests/'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  undeploy_monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install gke-gcloud-auth-plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_REGION }}

      - name: Undeploy Monitoring manifest
        run: |
          # 1. Delete everything except setup/ first
          for f in release/k8s-prometheus/manifests/*.yaml; do
            case "$f" in
            *nodeExporter*) echo "skipping $f (was never deployed)"; continue ;;
            esac
            kubectl delete -f "$f" --ignore-not-found=true
          done

          # 2. Then delete the namespace + CRDs
          kubectl delete -f release/k8s-prometheus/manifests/setup --ignore-not-found=true
